<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel=icon href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='25'>🌈</text></svg>"><title>Project Litr</title><style>body { background-color: #131313; } </style></head><body><canvas id="game"  width="400" height="300"></canvas></body><script> const N = { Bb1: 58.27, Eb2: 77.78, E2: 82.41, F2: 87.31, Gb2: 92.50, G2: 98.00, Bb2: 116.54, Eb3: 155.56, E3: 164.81, F3: 174.61, Gb3: 185.00, G3: 196.00, Bb3: 233.08, B3: 246.94, C4: 261.63, Db4: 277.18, D4: 293.66, Eb4: 311.13, E4: 329.63, F4: 349.23, Gb4: 369.99, G4: 392.00, Ab4: 415.30, A4: 440.00, Bb4: 466.16, C5: 523.25, Db5: 554.37, Eb5: 622.25, F5: 698.46 }; const PWR = { G5: [N.G3, N.D4, N.G4], Gb5: [N.Gb3, N.Db4, N.Gb4], F5: [N.F3, N.C4, N.F4], E5: [N.E3, N.B3, N.E4] }; const EbMinArp = [N.Eb4, N.Gb4, N.Bb4, N.Eb5, N.Bb4, N.Gb4, N.Eb4, N.Gb4]; const FMajArp = [N.F4, N.A4, N.C5, N.F5, N.C5, N.A4, N.F4, N.A4]; const BbMin9Arp = [N.Bb3, N.Db4, N.F4, N.Ab4, N.C5, N.Ab4, N.F4, N.Db4]; const BEAT = 60 / 90; const SEQUENCE = [ ...EbMinArp.map(note => [note, N.Eb2]), ...FMajArp.map(note => [note, N.F2]), ...EbMinArp.map(note => [note, N.Eb2]), ...BbMin9Arp.map(note => [note, N.Bb1]), [PWR.G5, N.G2], [PWR.G5, N.G2], [PWR.Gb5, N.Gb2], [PWR.Gb5, N.Gb2], [PWR.F5, N.F2], [PWR.F5, N.F2], [PWR.E5, N.E2], [PWR.E5, N.E2] ]; let audioCtx = null; let bakedBuffer = null; let currentSource = null; async function bakeAudio() { if (bakedBuffer) return; const totalDuration = SEQUENCE.length * BEAT; const sampleRate = 22050; const offlineCtx = new OfflineAudioContext(1, sampleRate * totalDuration, sampleRate); const bassOsc = offlineCtx.createOscillator(); const bassGain = offlineCtx.createGain(); bassOsc.type = 'triangle'; bassGain.gain.setValueAtTime(0.25, 0); bassOsc.connect(bassGain); bassGain.connect(offlineCtx.destination); bassOsc.start(0); SEQUENCE.forEach(([melodyItem, rootFreq], index) => { const time = index * BEAT; bassOsc.frequency.setTargetAtTime(rootFreq, time, 0.05); const freqs = Array.isArray(melodyItem) ? melodyItem : [melodyItem]; const isPowerChord = freqs.length > 1; const gain = offlineCtx.createGain(); const volume = isPowerChord ? 0.08 : 0.12; gain.gain.setValueAtTime(volume, time); gain.gain.exponentialRampToValueAtTime(0.001, time + BEAT * 0.9); gain.connect(offlineCtx.destination); freqs.forEach(freq => { if (!freq) return; const osc = offlineCtx.createOscillator(); osc.type = 'square'; osc.frequency.setValueAtTime(freq, time); osc.connect(gain); osc.start(time); osc.stop(time + BEAT * 0.9); }); }); bakedBuffer = await offlineCtx.startRendering(); } async function startArpeggiator() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if (audioCtx.state === 'suspended') { await audioCtx.resume(); } if (!bakedBuffer) { await bakeAudio(); } if (currentSource) return; currentSource = audioCtx.createBufferSource(); currentSource.buffer = bakedBuffer; currentSource.loop = true; currentSource.connect(audioCtx.destination); currentSource.start(0); } let noiseBuffer = null; function getNoiseBuffer(ctx) { if (noiseBuffer) return noiseBuffer; const bufferSize = ctx.sampleRate; noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate); const output = noiseBuffer.getChannelData(0); let lfsr = 0x7fff; for (let i = 0; i < bufferSize; i++) { const bit = ((lfsr >> 0) ^ (lfsr >> 1)) & 1; lfsr = (lfsr >> 1) | (bit << 14); output[i] = (lfsr & 1) ? 1 : -1; } return noiseBuffer; } function playNoise({ duration = 0.2, frequency = 1.0, pitchSweep = 0.0, volume = 0.2 } = {}) { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } const buffer = getNoiseBuffer(audioCtx); const source = audioCtx.createBufferSource(); const gain = audioCtx.gain || audioCtx.createGain(); source.buffer = buffer; const startTime = audioCtx.currentTime; const endTime = startTime + duration; source.playbackRate.setValueAtTime(frequency, startTime); if (pitchSweep !== 0) { const targetFreq = Math.max(0.01, frequency + pitchSweep); source.playbackRate.linearRampToValueAtTime(targetFreq, endTime); } gain.gain.setValueAtTime(volume, startTime); gain.gain.exponentialRampToValueAtTime(0.001, endTime); source.connect(gain); gain.connect(audioCtx.destination); source.start(startTime); source.stop(endTime); } const FONT_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ.,!?"; const FONT_DATA = [ 0o75557, 0o26227, 0o71747, 0o71717, 0o55711, 0o74717, 0o74757, 0o71222, 0o75757, 0o75717, 0o25755, 0o65656, 0o74447, 0o65556, 0o74747, 0o74744, 0o74557, 0o55755, 0o72227, 0o11152, 0o55655, 0o44447, 0o57555, 0o65555, 0o75557, 0o75744, 0o75571, 0o75765, 0o34216, 0o72222, 0o55557, 0o55552, 0o55575, 0o55255, 0o55222, 0o71247, 0o00002, 0o00024, 0o22202, 0o61202 ]; function drawText(ctx, text, x, y, scale = 1, color = "#fff") { ctx.fillStyle = color; text = text.toUpperCase(); for (let i = 0; i < text.length; i++) { const idx = FONT_CHARS.indexOf(text[i]); if (idx !== -1) { const glyph = FONT_DATA[idx]; for (let bit = 0; bit < 15; bit++) { if ((glyph >> (14 - bit)) & 1) { ctx.fillRect( x + (i * 4 + (bit % 3)) * scale, y + ((bit / 3) | 0) * scale, scale, scale ); } } } } } bakeAudio(); const handleStart = () => startArpeggiator(); window.addEventListener('click', handleStart, { once: true }); window.addEventListener('keydown', handleStart, { once: true }); let x = 10; let y = 10; const width = 150; const height = 100; const speed = 4; const canvas = document.getElementById("game"); const ctx = canvas.getContext("2d"); const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false }; window.addEventListener('keydown', (e) => { if (e.key in keys) { keys[e.key] = true; e.preventDefault(); } if (e.key === '1') { playNoise({ duration: 0.5, frequency: 0.2, pitchSweep: -0.15, volume: 0.3 }); } if (e.key === '2') { playNoise({ duration: 0.08, frequency: 2.2, volume: 0.15 }); } if (e.key === '3') { playNoise({ duration: 0.15, frequency: 1.8, pitchSweep: -1.4, volume: 0.2 }); } if (e.key === '4') { playNoise({ duration: 2.0, frequency: 1.0, pitchSweep: -20, volume: 0.4 }); } }); window.addEventListener('keyup', (e) => { if (e.key in keys) { keys[e.key] = false; } }); function update() { if (keys.ArrowUp) y -= speed; if (keys.ArrowDown) y += speed; if (keys.ArrowLeft) x -= speed; if (keys.ArrowRight) x += speed; x = Math.max(0, Math.min(canvas.width - width, x)); y = Math.max(0, Math.min(canvas.height - height, y)); } function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); const rainbow = ctx.createLinearGradient(x, 0, x + width, 0); const colors = ["red", "orange", "yellow", "green", "blue", "indigo", "violet"]; colors.forEach((color, index) => { rainbow.addColorStop(index / (colors.length - 1), color); }); ctx.fillStyle = rainbow; ctx.fillRect(x, y, width, height); drawText(ctx, "SCORE: 666!", 10, 10, 3, "#ff0"); drawText(ctx, "1 2 3 4 5 6 7 8 9 0 :", 10, 30, 3, "#f00"); drawText(ctx, "ABCDEFGHIJKLMNOPQRSTUVWXYZ.,!?", 10, 50, 2, "#0F0"); drawText(ctx, "PROJECT LITR", 10, 140, 8, "#FFF"); drawText(ctx, "1,2,3,4 to make noise!",10, 210,2); drawText(ctx, "Arrows to move the rainbow",10,230,2); } function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); } requestAnimationFrame(gameLoop); </script></html>
